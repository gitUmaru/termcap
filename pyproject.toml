[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termcap-cli"
version = "0.1.0"
description = "Record your terminal and export to text, SVG, GIF, PNG, JPEG, or MP4 — self-contained core."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Umar Ali" }]
keywords = ["terminal", "asciicast", "recording", "gif", "svg", "screencast"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=9.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/gitUmaru/termcap"
Repository = "https://github.com/gitUmaru/termcap"

[project.scripts]
termcap = "termcap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
